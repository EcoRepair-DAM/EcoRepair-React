apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecorepair-react
  labels:
    app: ecorepair
    tier: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecorepair
      tier: react
  template:
    metadata:
      labels:
        app: ecorepair
        tier: react
    spec:
      containers:
        - name: ecorepair-react
          # CAMBIAR LA VERSIÓN EN FUNCION DE LA NECESIDAD!
          image: a28731nerea/ecorepair-react:v3
          ports:
            - containerPort: 80
 